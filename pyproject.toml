[project]
name = "soccer-vision-players-stats"
version = "2.0.2"
description = "Soccer squad and player generator API"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
