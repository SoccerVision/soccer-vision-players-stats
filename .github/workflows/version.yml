# On each pull request into main, raise the patch version once.
# main rejects a direct push, and the organization does not let Actions open
# pull requests, so the bump is committed onto the pull request branch.
# The docs badge reads this version from pyproject.toml.
name: Version

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write

concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump patch version once per pull request
        id: bump
        run: |
          git fetch origin main
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import subprocess
          from pathlib import Path

          def read_version(text: str) -> str:
              match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"\s*$', text)
              if not match:
                  raise SystemExit("pyproject.toml has no version = \"X.Y.Z\"")
              return match.group(0), match, f"{match.group(1)}.{match.group(2)}.{match.group(3)}"

          path = Path("pyproject.toml")
          text = path.read_text()
          literal, match, current = read_version(text)
          main_text = subprocess.check_output(["git", "show", "origin/main:pyproject.toml"], text=True)
          _, _, base = read_version(main_text)
          if current != base:
              print("bumped=false")
              raise SystemExit(0)
          major, minor, patch = (int(part) for part in current.split("."))
          new = f"{major}.{minor}.{patch + 1}"
          path.write_text(text[:match.start()] + f'version = "{new}"' + text[match.end():])
          lock = Path("uv.lock")
          lock_text = lock.read_text()
          block = f'name = "soccer-vision-players-stats"\nversion = "{current}"'
          if block not in lock_text:
              raise SystemExit("uv.lock is missing the project version")
          lock.write_text(lock_text.replace(block, f'name = "soccer-vision-players-stats"\nversion = "{new}"', 1))
          print("bumped=true")
          print(f"version={new}")
          PY

      - uses: astral-sh/setup-uv@v5
        if: steps.bump.outputs.bumped == 'true'
        with:
          python-version: "3.12"

      - name: Test the bumped tree
        if: steps.bump.outputs.bumped == 'true'
        run: |
          uv sync --frozen --group dev
          uv run pytest

      - name: Commit the version bump
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git add pyproject.toml uv.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${PR_HEAD_REF}"
          # A push from this token does not start the tests workflow, so record
          # the run that just passed pytest as the required "tests" check.
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=tests \
            -f head_sha="$(git rev-parse HEAD)" \
            -f status=completed \
            -f conclusion=success \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
