# After each push to main, raise the patch version in pyproject.toml and uv.lock.
# The API docs badge (FastAPI `version`) is read from pyproject.toml.
# main requires a pull request, so the bump is opened and auto-merged.
# That merge commit starts with "Bump version to ", and this workflow skips it.
name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'Bump version to ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: bump
        run: |
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"\s*$', text)
          if not match:
              raise SystemExit("pyproject.toml has no version = \"X.Y.Z\"")
          major, minor, patch = (int(part) for part in match.groups())
          old = f"{major}.{minor}.{patch}"
          new = f"{major}.{minor}.{patch + 1}"
          path.write_text(text[:match.start()] + f'version = "{new}"' + text[match.end():])
          lock = Path("uv.lock")
          lock_text = lock.read_text()
          block = f'name = "soccer-vision-players-stats"\nversion = "{old}"'
          if block not in lock_text:
              raise SystemExit("uv.lock is missing the project version")
          lock.write_text(lock_text.replace(block, f'name = "soccer-vision-players-stats"\nversion = "{new}"', 1))
          print(new)
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open and auto-merge the version pull request
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add pyproject.toml uv.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Bump version to ${VERSION}"
          git push --force origin HEAD:version-bump
          if ! gh pr view version-bump --json number --jq .number >/dev/null 2>&1; then
            gh pr create --base main --head version-bump \
              --title "Bump version to ${VERSION}" \
              --body "Updates the version shown at the top of /docs."
          fi
          gh pr merge version-bump --squash --auto
