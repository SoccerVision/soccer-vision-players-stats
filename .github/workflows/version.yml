# After each push to main, raise the patch version in pyproject.toml.
# The API docs badge (FastAPI `version`) is read from that file.
# The bump commit itself is ignored, so this does not run again.
name: Version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'Bump version to ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: bump
        run: |
          version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'(?m)^version = "(\d+)\.(\d+)\.(\d+)"\s*$', text)
          if not match:
              raise SystemExit("pyproject.toml has no version = \"X.Y.Z\"")
          major, minor, patch = (int(part) for part in match.groups())
          old = f"{major}.{minor}.{patch}"
          new = f"{major}.{minor}.{patch + 1}"
          path.write_text(text[:match.start()] + f'version = "{new}"' + text[match.end():])
          lock = Path("uv.lock")
          lock_text = lock.read_text()
          block = f'name = "soccer-vision-players-stats"\nversion = "{old}"'
          if block not in lock_text:
              raise SystemExit("uv.lock is missing the project version")
          lock.write_text(lock_text.replace(block, f'name = "soccer-vision-players-stats"\nversion = "{new}"', 1))
          print(new)
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git add pyproject.toml uv.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Bump version to ${{ steps.bump.outputs.version }}"
          git push
