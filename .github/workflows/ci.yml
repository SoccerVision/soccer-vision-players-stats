name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  SQUAD_API_SHARED_SECRET: ci-test-secret-0123456789abcdef0123456789

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run pytest
      - run: uv run pip-audit
